name: Build Unsigned iOS IPA

# Produces an UNSIGNED .ipa you can sign yourself with Sideloadly (or similar) on a machine
# without a Mac — see the repo's plan notes for the full sideload flow with a free Apple ID
# (7-day expiry) or a paid Apple Developer account (1-year expiry, no repeated re-signing).
#
# IMPORTANT — not verified end-to-end: this workflow was written without access to a macOS
# runner or Xcode in the authoring environment. The Podfile target name ("Notely Voice") and the
# assumed Xcode scheme name are read from iosApp/Podfile and may not match the actual shared
# scheme. The first run will likely need a small fix here — most commonly the `-scheme` value
# below, found by opening iosApp/iosApp.xcodeproj in Xcode and checking Product > Scheme, or by
# running `xcodebuild -workspace iosApp/iosApp.xcworkspace -list` as an extra debug step.

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install CocoaPods dependencies
        working-directory: iosApp
        run: pod install --repo-update

      - name: Build unsigned .xcarchive
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -workspace iosApp.xcworkspace \
            -scheme "Notely Voice" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/NotelyVoice.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          set -e
          ARCHIVE_APP_DIR="$RUNNER_TEMP/NotelyVoice.xcarchive/Products/Applications"
          APP_NAME=$(ls "$ARCHIVE_APP_DIR" | grep '\.app$' | head -n1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found in archive — see Package.log above for the actual xcodebuild output."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$ARCHIVE_APP_DIR/$APP_NAME" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r NotelyVoice-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp NotelyVoice-unsigned.ipa "$GITHUB_WORKSPACE/build-output/"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: notely-voice-unsigned-ipa
          path: build-output/NotelyVoice-unsigned.ipa
          retention-days: 30
